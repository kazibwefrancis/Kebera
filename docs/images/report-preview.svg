<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="t d">
  <title id="t">Example Kebera report</title>
  <desc id="d">An example report: verdict says the main problem is on the provider's side, followed by findings and a stability table.</desc>
  <style>
    .t{font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1d2433}
    .m{fill:#5b6475;font-size:13px}
    .b{font-size:15px}
    .tag{font-size:11px;font-weight:700;fill:#fff;letter-spacing:.04em}
  </style>
  <rect width="900" height="620" rx="16" fill="#f6f7f9"/>
  <!-- window bar -->
  <rect width="900" height="36" rx="16" fill="#e3e6ec"/>
  <rect y="20" width="900" height="16" fill="#e3e6ec"/>
  <circle cx="22" cy="18" r="6" fill="#ef5350"/><circle cx="42" cy="18" r="6" fill="#ffb74d"/><circle cx="62" cy="18" r="6" fill="#81c784"/>
  <text x="450" y="23" text-anchor="middle" class="t m">report.html</text>

  <text x="36" y="80" class="t" font-size="24" font-weight="700">Kebera internet check-up</text>
  <text x="36" y="102" class="t m">2026-11-21 10:44 | standard test | Kebera 0.1.0</text>

  <rect x="36" y="118" width="828" height="74" rx="10" fill="#fff" stroke="#e3e6ec"/>
  <rect x="36" y="118" width="6" height="74" fill="#d4a017"/>
  <text x="58" y="148" class="t" font-size="17" font-weight="700">The main problem is on your internet provider's side.</text>
  <text x="58" y="172" class="t m">Your devices, Wi-Fi and router stayed healthy while the connection beyond them dropped or lagged.</text>

  <text x="36" y="226" class="t" font-size="16" font-weight="700">What we found</text>

  <g>
    <rect x="36" y="238" width="828" height="62" rx="10" fill="#fff" stroke="#e3e6ec"/>
    <rect x="52" y="252" width="70" height="20" rx="10" fill="#c62828"/><text x="87" y="266" text-anchor="middle" class="t tag">PROBLEM</text>
    <text x="136" y="266" class="t b" font-weight="700">Connection drops happen beyond your equipment</text>
    <text x="136" y="288" class="t m">Your router and outdoor unit answered, but Google and Cloudflare did not. Report it with this report.</text>
  </g>
  <g>
    <rect x="36" y="308" width="828" height="62" rx="10" fill="#fff" stroke="#e3e6ec"/>
    <rect x="52" y="322" width="70" height="20" rx="10" fill="#b26a00"/><text x="87" y="336" text-anchor="middle" class="t tag">WATCH</text>
    <text x="136" y="336" class="t b" font-weight="700">Strong but noisy mobile signal</text>
    <text x="136" y="358" class="t m">RSRP -66 (excellent), SINR 7 (fair). Usually a busy cell: ask your provider to check it.</text>
  </g>
  <g>
    <rect x="36" y="378" width="828" height="62" rx="10" fill="#fff" stroke="#e3e6ec"/>
    <rect x="52" y="392" width="70" height="20" rx="10" fill="#b26a00"/><text x="87" y="406" text-anchor="middle" class="t tag">WATCH</text>
    <text x="136" y="406" class="t b" font-weight="700">Neighbours share your Wi-Fi channel</text>
    <text x="136" y="428" class="t m">3 strong networks overlap channel 11. Use 5 GHz, or set 2.4 GHz to channel 1.</text>
  </g>

  <text x="36" y="474" class="t" font-size="16" font-weight="700">Stability (all links at the same moment)</text>
  <rect x="36" y="486" width="828" height="116" rx="10" fill="#fff" stroke="#e3e6ec"/>
  <g class="t" font-size="13">
    <text x="56" y="510" class="m" font-weight="700">Link</text><text x="430" y="510" class="m" font-weight="700">Lost</text><text x="530" y="510" class="m" font-weight="700">Average</text><text x="640" y="510" class="m" font-weight="700">Worst</text><text x="750" y="510" class="m" font-weight="700">Jitter</text>
    <text x="56" y="536">Your router</text><text x="430" y="536">0%</text><text x="530" y="536">2 ms</text><text x="640" y="536">14 ms</text><text x="750" y="536">2 ms</text>
    <text x="56" y="560">Next device (outdoor unit)</text><text x="430" y="560">0%</text><text x="530" y="560">3 ms</text><text x="640" y="560">12 ms</text><text x="750" y="560">1 ms</text>
    <text x="56" y="584">Internet (Google)</text><text x="430" y="584" fill="#c62828" font-weight="700">4.4%</text><text x="530" y="584">71 ms</text><text x="640" y="584" fill="#c62828" font-weight="700">567 ms</text><text x="750" y="584" fill="#b26a00" font-weight="700">62 ms</text>
  </g>
</svg>
